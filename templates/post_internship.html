<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post New Internship Slot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_dashboard.css') }}">
    <style>
        .form-container { 
            max-width: 500px; 
            margin: 50px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .grid-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 15px; 
        }
        .form-label {
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 5px;
            color: #334155;
        }
        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .save-btn {
            width: 100%; 
            margin-top: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .save-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body style="background: #f1f5f9;">

    <div class="form-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; color: #1e293b; font-size: 20px;">Post New Internship Slot</h3>
            <a href="/organization/post" style="color: #64748b; text-decoration: none; font-size: 18px;">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>

        <form action="/organization/post" method="POST">
            
            <div style="margin-bottom: 15px;">
                <label class="form-label">Title *</label>
                <input type="text" name="title" class="form-input" placeholder="e.g. Software Engineering Intern" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label class="form-label">Description *</label>
                <textarea name="description" class="form-input" style="height: 90px; resize: vertical;" placeholder="Describe the roles and core responsibilities..." required></textarea>
            </div>

            <div class="grid-row">
                <div>
                    <label class="form-label">Location *</label>
                    <input type="text" name="location" class="form-input" placeholder="e.g. Nairobi, Remote" required>
                </div>
                <div>
                    <label class="form-label">Duration *</label>
                    <input type="text" name="duration" class="form-input" placeholder="e.g. 3 months" required>
                </div>
            </div>

            <div class="grid-row">
                <div>
                    <label class="form-label">Available Slots *</label>
                    <input type="number" name="available_slots" class="form-input" value="1" min="1" required>
                </div>
                <div>
                    <label class="form-label">Application Deadline *</label>
                    <input type="date" name="end_date" class="form-input" required>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label class="form-label">Requirements *</label>
                <textarea name="requirements" class="form-input" style="height: 90px; resize: vertical;" placeholder="Required skills, experience, or field of study..." required></textarea>
            </div>

            <button type="submit" class="save-btn">Publish Opportunity</button>
        </form>
    </div>

</body>
</html>
